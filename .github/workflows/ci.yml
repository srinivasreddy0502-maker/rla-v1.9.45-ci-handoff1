name: RLA Safe CI Review

on:
  push:
    branches: ["review/rla-v1.9.45-ci-v3"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          echo "README exists"

      - name: Check npm registry connectivity
        shell: bash
        run: npm ping --registry=https://registry.npmjs.org/

      - name: Find and validate candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' zips < <(find . -type f -name '*NOT_RELEASE*.zip' -print0)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one NOT_RELEASE candidate ZIP; found ${#zips[@]}"
            exit 1
          fi
          unzip -t "${zips[0]}"
          mkdir -p "$RUNNER_TEMP/rla-candidate"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/rla-candidate"
          echo "CANDIDATE_DIR=$RUNNER_TEMP/rla-candidate" >> "$GITHUB_ENV"

      - name: Validate JSON and required dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          node - "$CANDIDATE_DIR" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.argv[2];

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const filePath = path.join(dir, entry.name);
              if (entry.isDirectory()) return walk(filePath);
              return [filePath];
            });
          }

          const files = walk(root);
          let blockedJsonCount = 0;

          for (const file of files.filter((filePath) => filePath.endsWith('.json'))) {
            const raw = fs.readFileSync(file, 'utf8');
            if (!raw.trim()) {
              if (path.basename(file) === 'native-sqlite-preflight-v1.9.26.json') {
                console.log(BLOCKED: Empty preflight evidence file: ${file});
                blockedJsonCount++;
                continue;
              }
              throw new Error(Empty JSON file: ${file});
            }
            JSON.parse(raw);
          }

          if (blockedJsonCount > 0) {
            console.log(Preflight evidence remains BLOCKED: ${blockedJsonCount});
          }

          const pkgPath = path.join(root, 'package.json');
          if (fs.existsSync(pkgPath)) {
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            const hasDeps = Object.keys({ ...pkg.dependencies, ...pkg.devDependencies }).length > 0;
            const locks = ['package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock', 'pnpm-lock.yaml'];
            if (hasDeps && !locks.some((name) => fs.existsSync(path.join(root, name)))) {
              throw new Error('Dependency lockfile missing');
            }
          }

          console.log('JSON and dependency-lockfile gates passed');
          NODE

  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' zips < <(find . -type f -name '*NOT_RELEASE*.zip*' -print0)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one NOT_RELEASE candidate ZIP; found ${#zips[@]}"
            exit 1
          fi
          unzip -t "${zips[0]}"
          mkdir -p "$RUNNER_TEMP/rla-candidate"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/rla-candidate"
          echo "CANDIDATE_DIR=$RUNNER_TEMP/rla-candidate" >> "$GITHUB_ENV"

      - name: Run offline test suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          npm run test:all:offline 2>&1 | tee "$RUNNER_TEMP/rla-offline-test.log"

      - name: Upload offline test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rla-offline-test-evidence
          path: ${{ runner.temp }}/rla-offline-test.log
          if-no-files-found: warn
          retention-days: 7
